<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>3D Moto - San Andreas</title>
  </head>
  <body>
    <div id="gta-hud">
      <div id="money-display">$00000000</div>
      <div id="bars-container">
        <div class="hud-bar health-bar"></div>
        <div class="hud-bar armor-bar"></div>
      </div>
      <div id="minimap-container">
        <div id="minimap-placeholder"></div>
      </div>
    </div>

    <div id="instructions">
      <h3>COMMANDS</h3>
      <ul>
        <li><span class="key">W</span> ACCELERATE</li>
        <li><span class="key">S</span> BRAKE / REVERSE</li>
        <li><span class="key">A</span> <span class="key">D</span> STEER / LEAN</li>
        <li><span class="key">SPACE</span> HANDBRAKE</li>
        <li><span class="key">R</span> RESET POSITION</li>
        <li><span class="key">MOUSE</span> LOOK AROUND</li>
        <li><span class="key">CLICK</span> LOCK CAMERA</li>
      </ul>
      <div class="objective">OBJECTIVE: EXPLORE THE CITY</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
